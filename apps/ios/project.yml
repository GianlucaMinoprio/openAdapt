name: OpenAdapt
options:
  bundleIdPrefix: org.openadapt
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: 1
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  OpenAdapt:
    type: application
    platform: iOS
    info:
      path: OpenAdapt/Info.plist
      properties:
        UIBackgroundModes: [bluetooth-central]
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: OpenAdapt
        excludes:
          - "**/*.private.*"
      - path: Sources/OpenAdaptCore
      - path: Config/SiriShortcuts
        type: folder
        buildPhase: resources
    postBuildScripts:
      - name: Local owner pairing (Debug only)
        script: |
          set -eu
          destination="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/OwnerPairing.private.json"
          source="${OPENADAPT_OWNER_PROFILE_PATH}"
          if [ "${CONFIGURATION}" = "Debug" ] && [ "${OPENADAPT_INCLUDE_OWNER_PAIRING}" = "YES" ] && [ -f "$source" ]; then
            /bin/cp "$source" "$destination"
            /bin/chmod 600 "$destination"
          else
            /bin/rm -f "$destination"
          fi
        inputFiles:
          - "$(OPENADAPT_OWNER_PROFILE_PATH)"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/OwnerPairing.private.json"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(OPENADAPT_BUNDLE_IDENTIFIER)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OpenAdapt
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: OpenAdapt uses Bluetooth to connect to your saved Adapt shoes and adjust their fit and lights.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: OpenAdapt/OpenAdapt.entitlements
  OpenAdaptUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: OpenAdaptUITests
    dependencies:
      - target: OpenAdapt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openadapt.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: OpenAdapt
schemes:
  OpenAdapt:
    build:
      targets:
        OpenAdapt: all
        OpenAdaptUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OpenAdaptUITests
    archive:
      config: Release
