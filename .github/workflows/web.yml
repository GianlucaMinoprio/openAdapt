name: Website
on:
  push:
    paths: ["apps/web/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["apps/web/**", ".github/workflows/web.yml"]
jobs:
  check-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
