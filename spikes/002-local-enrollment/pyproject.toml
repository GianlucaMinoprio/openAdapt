[project]
name = "adapt-local-enrollment-spike"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["cryptography>=44,<49", "bleak>=1,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--tb=short"
